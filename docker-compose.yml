services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: spreads
      POSTGRES_USER: spreads
      POSTGRES_PASSWORD: spreads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spreads -d spreads"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - spreads_postgres_data:/var/lib/postgresql/data
  clickhouse:
    image: clickhouse/clickhouse-server:25.5-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "58123:8123"
    environment:
      CLICKHOUSE_DB: spreads
      CLICKHOUSE_USER: spreads
      CLICKHOUSE_PASSWORD: spreads
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - spreads_clickhouse_data:/var/lib/clickhouse
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - spreads_nats_data:/data
  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: spreads
      POSTGRES_PWD: spreads
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "57233:7233"
  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:53000,http://localhost:58080
    ports:
      - "58088:8080"
  runtime-init:
    build:
      context: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "python", "-m", "core.services.runtime_init"]
    volumes:
      - .:/app
  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_OPS_LOG_DIR: /app/logs/ops
      WATCHFILES_FORCE_POLLING: "true"
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--timeout-graceful-shutdown",
        "2",
        "--reload-dir",
        "packages/core",
        "--reload-dir",
        "packages/api",
      ]
    volumes:
      - .:/app
    ports:
      - "58080:8000"
  worker-runtime:
    build:
      context: .
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_NATS_URL: nats://nats:4222
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
    command: ["uv", "run", "arq", "core.jobs.worker.RuntimeWorkerSettings"]
    volumes:
      - .:/app
  worker-temporal:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
      SPREADS_TEMPORAL_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "temporal-worker"]
    volumes:
      - .:/app
  worker-data:
    build:
      context: .
    restart: unless-stopped
    deploy:
      replicas: 1
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
    command: ["uv", "run", "arq", "core.jobs.worker.DataWorkerSettings"]
    volumes:
      - .:/app
  worker-valuation:
    profiles:
      - container-valuation
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
    command: ["uv", "run", "arq", "core.jobs.worker.ValuationWorkerSettings"]
    volumes:
      - .:/app
  worker-research:
    profiles:
      - container-research
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
      SPREADS_TRADINGAGENTS_DIR: /tradingagents
      SPREADS_TRADINGAGENTS_UV_ENVIRONMENT: /app/outputs/tradingagents/.venv
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uv", "run", "arq", "core.jobs.worker.ResearchWorkerSettings"]
    volumes:
      - .:/app
      - /home/ade/Projects/TradingAgents:/tradingagents:ro
  scheduler:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "spreads", "runtime", "scheduler"]
    volumes:
      - .:/app
  market-recorder:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
    command: ["uv", "run", "spreads", "runtime", "market-recorder"]
    volumes:
      - .:/app
  web:
    build:
      context: ./packages/web
      target: dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      SPREADS_API_BASE_URL: http://api:8000
      SPREADS_WEB_ALLOWED_DEV_ORIGINS: ${SPREADS_WEB_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1,100.111.132.114,192.168.2.6,ade-nucbox-k8-plus,ade-NucBox-K8-Plus}
      NEXT_PUBLIC_SPREADS_API_WS_PORT: "58080"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./packages/web:/app
      - web_node_modules:/app/node_modules
      - web_next_data:/app/.next
      - web_npm_cache:/root/.npm
    ports:
      - "53000:3000"

volumes:
  spreads_postgres_data:
  spreads_clickhouse_data:
  spreads_nats_data:
  web_node_modules:
  web_next_data:
  web_npm_cache:
