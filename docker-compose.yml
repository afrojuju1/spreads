x-temporal-sdk-metrics: &temporal-sdk-metrics
  SPREADS_TEMPORAL_METRICS_BIND_ADDRESS: "0.0.0.0:9464"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: spreads
      POSTGRES_USER: spreads
      POSTGRES_PASSWORD: spreads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spreads -d spreads"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - spreads_postgres_data:/var/lib/postgresql/data
  clickhouse:
    image: clickhouse/clickhouse-server:25.5-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "58123:8123"
    environment:
      CLICKHOUSE_DB: spreads
      CLICKHOUSE_USER: spreads
      CLICKHOUSE_PASSWORD: spreads
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - spreads_clickhouse_data:/var/lib/clickhouse
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - spreads_nats_data:/data
  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: spreads
      POSTGRES_PWD: spreads
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: spreads
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]
    volumes:
      - ./ops/temporal:/scripts:ro
  temporal:
    image: temporalio/server:1.31.2
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: spreads
      POSTGRES_PWD: spreads
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production.yaml
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    volumes:
      - ./ops/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/production.yaml:ro
    ports:
      - "127.0.0.1:57233:7233"
  temporal-namespace:
    image: temporalio/admin-tools:1.31.2
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_NAMESPACE_RETENTION: 7d
    entrypoint: ["/bin/sh"]
    command: ["/scripts/ensure-namespace.sh"]
    volumes:
      - ./ops/temporal:/scripts:ro
  temporal-ui:
    image: temporalio/ui:2.52.1
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:53000,http://localhost:58080
    ports:
      - "127.0.0.1:58088:8080"
  runtime-init:
    build:
      context: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "python", "-m", "core.services.runtime_init"]
    volumes:
      - .:/app
  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_OPS_LOG_DIR: /app/logs/ops
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
      WATCHFILES_FORCE_POLLING: "true"
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--timeout-graceful-shutdown",
        "2",
        "--reload-dir",
        "packages/core",
        "--reload-dir",
        "packages/api",
      ]
    volumes:
      - .:/app
    ports:
      - "58080:8000"
  workflow-runtime:
    build:
      context: .
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      nats:
        condition: service_started
    env_file:
      - .env
    environment:
      <<: *temporal-sdk-metrics
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_NATS_URL: nats://nats:4222
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "worker", "--lane", "runtime"]
    volumes:
      - .:/app
  workflow-lifecycle:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *temporal-sdk-metrics
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "worker", "--lane", "lifecycle"]
    volumes:
      - .:/app
  workflow-data:
    build:
      context: .
    restart: unless-stopped
    deploy:
      replicas: 1
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *temporal-sdk-metrics
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "worker", "--lane", "data"]
    volumes:
      - .:/app
  workflow-maintenance:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *temporal-sdk-metrics
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
      SPREADS_BACKUP_ROOT: /app/backups/postgres
      SPREADS_OPS_LOG_DIR: /app/logs/ops
    command: ["uv", "run", "spreads", "runtime", "worker", "--lane", "maintenance"]
    volumes:
      - .:/app
      - ./backups:/app/backups
      - ./logs:/app/logs

  workflow-valuation:
    profiles:
      - workflow-valuation
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      <<: *temporal-sdk-metrics
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "worker", "--lane", "valuation"]
    volumes:
      - .:/app
  workflow-research:
    profiles:
      - workflow-research
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      <<: *temporal-sdk-metrics
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_INTERNAL_API_BASE_URL: http://api:8000
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
      SPREADS_TRADINGAGENTS_DIR: /tradingagents
      SPREADS_TRADINGAGENTS_UV_ENVIRONMENT: /app/outputs/tradingagents/.venv
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uv", "run", "spreads", "runtime", "worker", "--lane", "research"]
    volumes:
      - .:/app
      - /home/ade/Projects/TradingAgents:/tradingagents:ro
  routine-schedules:
    profiles:
      - deploy
    build:
      context: .
    restart: "no"
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      REDIS_URL: redis://redis:6379/0
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "routine-schedules"]
    volumes:
      - .:/app
  capture-worker:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *temporal-sdk-metrics
      SPREADS_DATABASE_URL: postgresql://spreads:spreads@postgres:5432/spreads
      SPREADS_CLICKHOUSE_URL: http://spreads:spreads@clickhouse:8123/spreads
      SPREADS_WORKFLOW_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "capture-worker"]
    volumes:
      - .:/app
  web:
    build:
      context: ./packages/web
      target: dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      SPREADS_API_BASE_URL: http://api:8000
      SPREADS_WEB_ALLOWED_DEV_ORIGINS: ${SPREADS_WEB_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1,100.111.132.114,192.168.2.6,ade-nucbox-k8-plus,ade-NucBox-K8-Plus}
      NEXT_PUBLIC_SPREADS_API_WS_PORT: "58080"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./packages/web:/app
      - web_node_modules:/app/node_modules
      - web_next_data:/app/.next
      - web_npm_cache:/root/.npm
    ports:
      - "53000:3000"

volumes:
  spreads_postgres_data:
  spreads_clickhouse_data:
  spreads_nats_data:
  web_node_modules:
  web_next_data:
  web_npm_cache:
