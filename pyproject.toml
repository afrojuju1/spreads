[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spreads"
version = "0.1.0"
description = "Alpaca-based options spread scanner"
requires-python = ">=3.11"
dependencies = [
  "arq>=0.25.0",
  "alembic>=1.16.5",
  "fastapi>=0.118.0",
  "msgpack>=1.1.0",
  "pandas-market-calendars>=4.4.1",
  "pyarrow>=20.0.0",
  "python-dotenv>=1.1.1",
  "psycopg[binary]>=3.2.10",
  "py-vollib>=1.0.1",
  "rich>=13.7.1",
  "scikit-learn>=1.5.0",
  "sqlalchemy>=2.0.43",
  "typer>=0.12.5",
  "uvicorn>=0.37.0",
  "websocket-client>=1.8.0",
  "websockets>=16.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
spreads = "core.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/core", "packages/api"]

[tool.black]
line-length = 150
target-version = ["py311"]

[tool.ruff]
line-length = 150
target-version = "py311"
src = ["packages/core", "packages/api", "scripts", "alembic"]
extend-exclude = ["backups", "data", "logs", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"packages/api/main.py" = ["F401"]
"scripts/one_time/*.py" = ["E402"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.15",
]
