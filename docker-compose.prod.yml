name: ${SPREADS_COMPOSE_PROJECT_NAME}

x-default-logging: &default-logging
  driver: ${SPREADS_DOCKER_LOG_DRIVER}
  options:
    max-size: ${SPREADS_DOCKER_LOG_MAX_SIZE}
    max-file: "${SPREADS_DOCKER_LOG_MAX_FILE}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - spreads_postgres_data:/var/lib/postgresql/data
    ports:
      - "${SPREADS_BIND_HOST}:${SPREADS_POSTGRES_PORT}:5432"
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:25.5-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - spreads_clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "${SPREADS_BIND_HOST}:${SPREADS_CLICKHOUSE_PORT}:8123"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${SPREADS_BIND_HOST}:${SPREADS_REDIS_PORT}:6379"
    logging: *default-logging

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    logging: *default-logging

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${SPREADS_WEB_PORT},http://localhost:${SPREADS_API_PORT}
    logging: *default-logging

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${SPREADS_CONTAINER_ENV_FILE}
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-graceful-shutdown",
        "10",
      ]
    ports:
      - "${SPREADS_BIND_HOST}:${SPREADS_API_PORT}:8000"
    environment:
      SPREADS_OPS_LOG_DIR: /app/logs/ops
    volumes:
      - ${SPREADS_OPS_LOG_DIR}:/app/logs/ops:ro
    logging: *default-logging

  worker-temporal:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started
    env_file:
      - ${SPREADS_CONTAINER_ENV_FILE}
    environment:
      SPREADS_TEMPORAL_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "temporal-worker"]
    logging: *default-logging

  worker-runtime:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started
    env_file:
      - ${SPREADS_CONTAINER_ENV_FILE}
    environment:
      SPREADS_TEMPORAL_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "temporal-worker", "--task-queue", "spreads-runtime-jobs", "--kind", "jobs"]
    logging: *default-logging

  worker-data:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started
    env_file:
      - ${SPREADS_CONTAINER_ENV_FILE}
    environment:
      SPREADS_TEMPORAL_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "temporal-worker", "--task-queue", "spreads-data-jobs", "--kind", "jobs"]
    logging: *default-logging

  worker-valuation:
    profiles: ["container-valuation"]
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started
    env_file:
      - ${SPREADS_CONTAINER_ENV_FILE}
    environment:
      SPREADS_TEMPORAL_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "temporal-worker", "--task-queue", "spreads-valuation-jobs", "--kind", "jobs"]
    logging: *default-logging

  worker-research:
    profiles: ["container-research"]
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started
    env_file:
      - ${SPREADS_CONTAINER_ENV_FILE}
    environment:
      SPREADS_TEMPORAL_ADDRESS: temporal:7233
      SPREADS_TRADINGAGENTS_DIR: ${SPREADS_TRADINGAGENTS_DIR}
      SPREADS_TRADINGAGENTS_UV_ENVIRONMENT: ${SPREADS_TRADINGAGENTS_UV_ENVIRONMENT}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uv", "run", "spreads", "runtime", "temporal-worker", "--task-queue", "spreads-research-jobs", "--kind", "jobs"]
    volumes:
      - ${SPREADS_TRADINGAGENTS_HOST_DIR}:${SPREADS_TRADINGAGENTS_DIR}:ro
      - spreads_tradingagents_outputs:/app/outputs/tradingagents
    logging: *default-logging

  temporal-schedules:
    build:
      context: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - ${SPREADS_CONTAINER_ENV_FILE}
    environment:
      SPREADS_TEMPORAL_ADDRESS: temporal:7233
    command: ["uv", "run", "spreads", "runtime", "temporal-schedules"]
    logging: *default-logging

  market-recorder:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    env_file:
      - ${SPREADS_CONTAINER_ENV_FILE}
    command: ["uv", "run", "spreads", "runtime", "market-recorder"]
    logging: *default-logging

  web:
    build:
      context: ./packages/web
      target: runner
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    profiles: ["web"]
    environment:
      NODE_ENV: production
      SPREADS_API_BASE_URL: ${SPREADS_WEB_INTERNAL_API_BASE_URL}
      SPREADS_WEB_ALLOWED_DEV_ORIGINS: ${SPREADS_WEB_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1}
      NEXT_PUBLIC_SPREADS_API_WS_PORT: "${SPREADS_API_PORT}"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${SPREADS_BIND_HOST}:${SPREADS_WEB_PORT}:3000"
    logging: *default-logging

volumes:
  spreads_postgres_data:
    name: ${SPREADS_POSTGRES_VOLUME_NAME}
  spreads_clickhouse_data:
    name: ${SPREADS_CLICKHOUSE_VOLUME_NAME}
  spreads_tradingagents_outputs:
    name: ${SPREADS_COMPOSE_PROJECT_NAME}_tradingagents_outputs
