name: ade-nucbox-k8-plus
mode: ssh
description: Private single-host deployment on the ade-NucBox-K8-Plus tailnet box.
ssh_host: ade-nucbox-k8-plus
deploy_root: /home/ade/Projects/spreads
compose_file: docker-compose.yml
env_file: .env
compose_project_name: spreads
bind_host: 100.111.132.114
api_port: 58080
postgres_port: 55432
clickhouse_port: 58123
redis_port: 56379
web_port: 53000
runtime_lane_replicas: 2
data_lane_replicas: 1
maintenance_lane_replicas: 1
valuation_lane_replicas: 0
research_lane_replicas: 0
web_enabled: true
backup_retention_days: 7
health_check_minutes: 5
capture_owner_target: ade-nucbox-k8-plus
postgres_volume_name: spreads_spreads_postgres_data
clickhouse_volume_name: spreads_spreads_clickhouse_data
docker_log_driver: local
docker_log_max_size: 10m
docker_log_max_file: 5
