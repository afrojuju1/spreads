name: ade-nucbox-k8-plus
mode: ssh
description: Private single-host deployment on the ade-NucBox-K8-Plus tailnet box.
ssh_host: ade-nucbox-k8-plus
deploy_root: /home/ade/Projects/spreads
compose_file: docker-compose.yml
env_file: .env
compose_project_name: spreads
bind_host: 100.111.132.114
api_port: 58080
postgres_port: 55432
redis_port: 56379
web_port: 53000
worker_runtime_replicas: 2
worker_data_replicas: 1
worker_valuation_replicas: 0
worker_research_replicas: 0
web_enabled: true
backup_retention_days: 7
health_check_minutes: 5
market_recorder_owner_env: ade-nucbox-k8-plus
excluded_job_types:
  - tradingagents_scan
  - company_valuation_bootstrap
  - company_valuation_screen_materialize
  - company_valuation_resolve_unresolved
postgres_volume_name: spreads_spreads_postgres_data
docker_log_driver: local
docker_log_max_size: 10m
docker_log_max_file: 5
