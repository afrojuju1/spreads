name: local
mode: local
description: Private single-host deployment on the current machine.
deploy_root: .
compose_file: docker-compose.prod.yml
env_file: .env.deploy.local
compose_project_name: spreads-local
bind_host: 127.0.0.1
api_port: 58080
postgres_port: 55432
clickhouse_port: 58123
redis_port: 56379
web_port: 53000
runtime_lane_replicas: 1
data_lane_replicas: 1
maintenance_lane_replicas: 1
valuation_lane_replicas: 0
research_lane_replicas: 0
web_enabled: true
capture_owner_target: ade-nucbox-k8-plus
postgres_volume_name: spreads_local_postgres_data
clickhouse_volume_name: spreads_local_clickhouse_data
docker_log_driver: local
docker_log_max_size: 10m
docker_log_max_file: 5
