template_id: platform_hardware
template_version: v1
status: active

assignment_rules:
  sic_prefixes: []
  naics_prefixes: []
  keyword_rules: []

required_features:
  - revenue_ttm_growth
  - gross_margin_ttm
  - operating_margin_ttm
  - free_cash_flow_ttm
  - diluted_share_growth_ttm

optional_features:
  - deferred_revenue_growth
  - sbc_as_pct_revenue
  - capex_intensity
  - inventory_turns

quality_weight_map:
  growth_score: 16
  profitability_score: 20
  cash_flow_score: 18
  capital_efficiency_score: 12
  balance_sheet_score: 10
  shareholder_score: 12
  ownership_score: 4
  reporting_quality_score: 8

ownership_weight_map:
  insider_signal: 3
  beneficial_owner_signal: 2
  institutional_holder_signal: 1

valuation_model_mix:
  dcf_weight: 0.75
  historical_multiples_weight: 0.25
  primary_multiple_metrics:
    - ev_ebit
    - ev_fcf
    - pe
    - ps
  forecast_years: 6
  initial_growth_floor: -0.01
  initial_growth_cap: 0.2
  terminal_growth_multiplier: 0.52
  growth_adjustment_factor: 0.9
  growth_adjustment_min: 0.8
  growth_adjustment_max: 1.45
  normalized_fcf_from_ebit_ratio: 0.7
  terminal_growth_floor: 0.02
  terminal_growth_cap: 0.035
  discount_rate_spread_bps: 430
  quality_premium_floor_score: 60
  quality_premium_full_score: 86
  quality_multiple_premium_max: 0.22
  quality_discount_rate_reduction_bps_max: 85

confidence_rules:
  low_confidence_if:
    - persistent_negative_fcf
    - repeated_restatements
    - missing_core_facts
  negative_fcf_penalty: 0.18
  high_leverage_threshold: 2.5
  high_leverage_penalty: 0.1
  declining_revenue_penalty: 0.08
  unprofitable_penalty: 0.08

risk_rules:
  add_flags_if:
    - product_cycle_risk
    - platform_margin_reversal
    - ownership_concentration_high

unsupported_conditions: []
