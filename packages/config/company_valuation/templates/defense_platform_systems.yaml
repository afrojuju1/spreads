template_id: defense_platform_systems
template_version: v1
status: active

assignment_rules:
  sic_prefixes: []
  naics_prefixes: []
  keyword_rules:
    - defense
    - missile
    - radar
    - avionics
    - guidance

required_features:
  - revenue_ttm_growth
  - operating_margin_ttm
  - free_cash_flow_ttm
  - capex_intensity
  - net_leverage

optional_features:
  - roic_ttm
  - backlog_proxy_growth
  - diluted_share_growth_ttm

quality_weight_map:
  growth_score: 10
  profitability_score: 18
  cash_flow_score: 18
  capital_efficiency_score: 16
  balance_sheet_score: 15
  shareholder_score: 8
  ownership_score: 5
  reporting_quality_score: 10

ownership_weight_map:
  insider_signal: 2
  beneficial_owner_signal: 2
  institutional_holder_signal: 1

valuation_model_mix:
  dcf_weight: 0.25
  historical_multiples_weight: 0.75
  primary_multiple_metrics:
    - ev_ebit
    - ev_fcf
    - pb
    - ev_ebitda
  default_multiple_anchors:
    ev_ebit: 23.5
    ev_fcf: 31.0
    pb: 6.0
    ev_ebitda: 17.0
  forecast_years: 5
  initial_growth_floor: -0.03
  initial_growth_cap: 0.17
  terminal_growth_multiplier: 0.5
  growth_adjustment_factor: 0.68
  growth_adjustment_min: 0.76
  growth_adjustment_max: 1.52
  normalized_fcf_from_ebit_ratio: 0.82
  terminal_growth_floor: 0.015
  terminal_growth_cap: 0.028
  discount_rate_spread_bps: 315
  quality_premium_floor_score: 55
  quality_premium_full_score: 78
  quality_multiple_premium_max: 0.36
  quality_discount_rate_reduction_bps_max: 120

confidence_rules:
  low_confidence_if:
    - repeated_restatements
    - missing_core_facts
    - execution_recovery_unresolved
  negative_fcf_penalty: 0.18
  high_leverage_threshold: 3.0
  high_leverage_penalty: 0.11
  declining_revenue_penalty: 0.08
  unprofitable_penalty: 0.09

risk_rules:
  add_flags_if:
    - leverage_above_threshold
    - cash_conversion_weak
    - ownership_concentration_high

unsupported_conditions: []
