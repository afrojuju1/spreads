template_id: retail_consumer_compounder
template_version: v1
status: active

assignment_rules:
  sic_prefixes: []
  naics_prefixes: []
  keyword_rules: []

required_features:
  - revenue_ttm_growth
  - gross_margin_ttm
  - operating_margin_ttm
  - free_cash_flow_ttm
  - inventory_turns

optional_features:
  - working_capital_intensity
  - store_margin_trend
  - diluted_share_growth_ttm

quality_weight_map:
  growth_score: 14
  profitability_score: 19
  cash_flow_score: 17
  capital_efficiency_score: 13
  balance_sheet_score: 13
  shareholder_score: 9
  ownership_score: 5
  reporting_quality_score: 10

ownership_weight_map:
  insider_signal: 2
  beneficial_owner_signal: 2
  institutional_holder_signal: 1

valuation_model_mix:
  dcf_weight: 0.4
  historical_multiples_weight: 0.6
  primary_multiple_metrics:
    - ev_ebit
    - ev_fcf
    - pe
  default_multiple_anchors:
    ev_ebit: 23.0
    ev_fcf: 31.0
    pe: 30.0
  forecast_years: 5
  initial_growth_floor: -0.06
  initial_growth_cap: 0.16
  terminal_growth_multiplier: 0.5
  growth_adjustment_factor: 0.82
  growth_adjustment_min: 0.74
  growth_adjustment_max: 1.55
  normalized_fcf_from_ebit_ratio: 0.72
  terminal_growth_floor: 0.012
  terminal_growth_cap: 0.028
  discount_rate_spread_bps: 350
  quality_premium_floor_score: 52
  quality_premium_full_score: 76
  quality_multiple_premium_max: 0.42
  quality_discount_rate_reduction_bps_max: 105

confidence_rules:
  low_confidence_if:
    - inventory_metrics_missing
    - repeated_margin_shock
    - missing_core_facts
  negative_fcf_penalty: 0.18
  high_leverage_threshold: 3.0
  high_leverage_penalty: 0.1
  declining_revenue_penalty: 0.09
  unprofitable_penalty: 0.08

risk_rules:
  add_flags_if:
    - inventory_risk
    - demand_volatility
    - ownership_concentration_high

unsupported_conditions: []
