template_id: software_workflow_growth
template_version: v1
status: active

assignment_rules:
  sic_prefixes: []
  naics_prefixes: []
  keyword_rules:
    - saas
    - software
    - workflow
    - cloud

required_features:
  - revenue_ttm_growth
  - gross_margin_ttm
  - operating_margin_ttm
  - free_cash_flow_ttm
  - diluted_share_growth_ttm
  - sbc_as_pct_revenue

optional_features:
  - deferred_revenue_growth
  - capex_intensity
  - net_cash_position

quality_weight_map:
  growth_score: 22
  profitability_score: 14
  cash_flow_score: 16
  capital_efficiency_score: 10
  balance_sheet_score: 10
  shareholder_score: 10
  ownership_score: 6
  reporting_quality_score: 12

ownership_weight_map:
  insider_signal: 3
  beneficial_owner_signal: 2
  institutional_holder_signal: 1

valuation_model_mix:
  dcf_weight: 0.55
  historical_multiples_weight: 0.45
  primary_multiple_metrics:
    - ev_fcf
    - pe
    - ps
  default_multiple_anchors:
    ev_fcf: 27.0
    pe: 30.0
    ps: 6.8
  forecast_years: 6
  initial_growth_floor: -0.02
  initial_growth_cap: 0.26
  terminal_growth_multiplier: 0.5
  growth_adjustment_factor: 0.9
  growth_adjustment_min: 0.82
  growth_adjustment_max: 1.55
  normalized_fcf_from_ebit_ratio: 0.55
  terminal_growth_floor: 0.02
  terminal_growth_cap: 0.03
  discount_rate_spread_bps: 500
  quality_premium_floor_score: 58
  quality_premium_full_score: 80
  quality_multiple_premium_max: 0.2
  quality_discount_rate_reduction_bps_max: 70

confidence_rules:
  low_confidence_if:
    - persistent_negative_fcf
    - sbc_not_offset_by_growth
    - missing_core_facts
  negative_fcf_penalty: 0.2
  high_leverage_threshold: 2.5
  high_leverage_penalty: 0.12
  declining_revenue_penalty: 0.07
  unprofitable_penalty: 0.07

risk_rules:
  add_flags_if:
    - sbc_dilution_heavy
    - ownership_concentration_high
    - margin_reversal

unsupported_conditions: []
