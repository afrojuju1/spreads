ticker_source_id: finviz_momentum
job_key: ticker_source:finviz_momentum
enabled: true
schedule:
  type: market_session
  minutes: 2
allow_off_hours: false
recipe: finviz_screener
recipe_args:
  source: auto
  source_url: https://finviz.com/screener?v=111&f=sh_avgvol_o1000,sh_price_o10,sh_relvol_o1.5,ta_change_u&o=-relativevolume
  min_price: 10
  min_market_cap: 1000000000
  min_volume: 1000000
  target_dte_options:
    enabled: true
    min_dte: 7
    max_dte: 21
    feed: opra
    stock_feed: sip
    require_expected_move: true
    min_expected_move_count: 1
  exclude_industries:
    - Exchange Traded Fund
  exclude_company_keywords:
    - ETF
    - ETN
    - 2X
    - 3X
    - Leveraged
    - Inverse
    - Ultra
    - UltraPro
    - UltraShort
    - ProShares
    - Direxion
    - GraniteShares
    - Leverage Shares
    - Daily Bull
    - Daily Bear
  timeout_seconds: 20
