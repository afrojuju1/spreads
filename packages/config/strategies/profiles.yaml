portfolio_models:
  momentum_long_call_10_slots:
    limits:
      max_open_positions: 10
      max_daily_actions: 15
      max_new_entries_per_day: 15
      daily_loss_limit: 500
      portfolio_admission:
        max_strategy_open_positions: 10
        max_family_open_positions: 10
        max_symbol_family_open_positions: 1
        max_daily_new_entries: 15
        max_total_strategy_risk: 5000
        max_correlated_group_open_positions: 6
    sizing:
      max_risk_per_trade: 500
  index_credit_vertical_2_slots:
    limits:
      extends: baseline
      portfolio_admission:
        max_strategy_open_positions: 2
        max_family_open_positions: 2
        max_symbol_family_open_positions: 1
        max_daily_new_entries: 2
        max_total_strategy_risk: 1000
        max_correlated_group_open_positions: 3
    sizing:
      min_return_on_risk: 0.13
      position_size_pct_of_available_balance: 0.0025
      max_credit_slippage_pct: 0.25
  index_condor_1_slot:
    limits:
      extends: baseline
      portfolio_admission:
        max_strategy_open_positions: 1
        max_family_open_positions: 1
        max_symbol_family_open_positions: 1
        max_daily_new_entries: 1
        max_total_strategy_risk: 1000
        max_correlated_group_open_positions: 2
    sizing:
      min_return_on_risk: 0.13
      position_size_pct_of_available_balance: 0.0025
      max_credit_slippage_pct: 0.25
  earnings_call_debit_1_slot:
    limits:
      extends: baseline
      max_open_positions: 1
      max_new_entries_per_day: 1
      daily_loss_limit: 125
      portfolio_admission:
        max_strategy_open_positions: 1
        max_family_open_positions: 1
        max_symbol_family_open_positions: 1
        max_daily_new_entries: 1
        max_total_strategy_risk: 750
        max_correlated_group_open_positions: 2
    sizing:
      min_return_on_risk: 0.05
      position_size_pct_of_available_balance: 0.0025
      max_credit_slippage_pct: 0.25
  earnings_put_debit_baseline_limits:
    limits:
      extends: baseline
      portfolio_admission:
        max_strategy_open_positions: 1
        max_family_open_positions: 1
        max_symbol_family_open_positions: 1
        max_daily_new_entries: 1
        max_total_strategy_risk: 750
        max_correlated_group_open_positions: 2
    sizing:
      min_return_on_risk: 0.05
      position_size_pct_of_available_balance: 0.0025
      max_credit_slippage_pct: 0.25
  earnings_long_vol_1_slot:
    limits:
      extends: baseline
      portfolio_admission:
        max_strategy_open_positions: 1
        max_family_open_positions: 1
        max_symbol_family_open_positions: 1
        max_daily_new_entries: 1
        max_total_strategy_risk: 1500
        max_correlated_group_open_positions: 2
    sizing:
      min_return_on_risk: 0.05
      position_size_pct_of_available_balance: 0.0025
      max_credit_slippage_pct: 0.25
  etf_short_put_cash_secured:
    limits:
      extends: baseline
      portfolio_admission:
        max_strategy_open_positions: 1
        max_family_open_positions: 1
        max_symbol_family_open_positions: 1
        max_daily_new_entries: 1
        max_total_strategy_risk: 75000
        max_correlated_group_open_positions: 1
    sizing:
      min_return_on_risk: 0.05
      position_size_pct_of_available_balance: 0.0025
      max_credit_slippage_pct: 0.25

protection_models:
  short_dated_default_protections:
    runtime:
      extends: short_dated_default
  momentum_intraday_protections:
    runtime:
      cancel_pending_entries_after_et: "15:30"
      flatten_positions_at_et: "15:45"
      paused: false
  iron_condor_late_day_protections:
    runtime:
      extends: short_dated_default
      cancel_pending_entries_after_et: "15:00"
      flatten_positions_at_et: "15:40"

executor_profiles:
  alpaca_auto_direct:
    approval: auto
    runtime: alpaca_direct
    order_style:
      order_type: limit
      time_in_force: day
      pricing_mode: adaptive_credit
      min_credit_retention_pct: 0.95
    quote_freshness:
      max_age_seconds: 180
    open_lifecycle:
      submit_ttl_minutes: 5
      stale_order_action: cancel_and_reprice
      repricing:
        enabled: true
        stale_after_seconds: 75
        max_reprices: 3
        price_step: 0.01
        max_concession: 0.03
    close_lifecycle:
      submit_ttl_minutes: 5
      stale_order_action: cancel_and_reprice
      repricing:
        enabled: true
        stale_after_seconds: 75
        max_reprices: 3
        price_step: 0.01
        max_concession: 0.03
    unsupported_structure_behavior: fail_closed

exit_controllers:
  momentum_long_call_exit:
    routine_profile: momentum_manage_1m
    policy:
      profit_target_pct: 0.40
      stop_loss_pct: 0.30
      force_close_minutes_before_close: 15
      max_spread_pct: 20
      max_quote_age_seconds: 180
      underlying_invalidation:
        enabled: true
        min_intraday_bars: 30
        recent_lookback_bars: 5
        confirmation_bars: 2
        breakdown_tolerance_bps: 5
        max_spread_pct: 1.0
        max_quote_age_seconds: 180
  short_dated_credit_exit:
    routine_profile: short_dated_manage_1m
    recipes:
      - take_profit_50pct
      - max_loss_2x_credit
      - expiry_day_exit
  short_dated_debit_exit:
    routine_profile: short_dated_manage_1m
    recipes:
      - take_profit_40pct
      - max_loss_40pct_debit
      - expiry_day_exit
  short_dated_iron_condor_exit:
    routine_profile: short_dated_iron_condor_manage_1m
    recipes:
      - take_profit_50pct
      - max_loss_2x_credit
      - expiry_day_exit

archetypes:
  momentum_long_call:
    universe_model: finviz_momentum_dynamic
    structure_family: long_call
    default_structure_model: momentum_long_call_7_21d
    liquidity_profile: liquid_momentum_options
    entry_routine_profile: momentum_entry_2m
    portfolio_model: momentum_long_call_10_slots
    protection_model: momentum_intraday_protections
    executor_profile: alpaca_auto_direct
    exit_controller: momentum_long_call_exit
  index_credit_vertical:
    universe_model: liquid_index_etfs_static
    allowed_trade_structures:
      - call_credit_spread
      - put_credit_spread
    liquidity_profile: short_dated_liquid_options
    entry_routine_profile: short_dated_entry_5m_full_day
    portfolio_model: index_credit_vertical_2_slots
    protection_model: short_dated_default_protections
    executor_profile: alpaca_auto_direct
    exit_controller: short_dated_credit_exit
  index_iron_condor:
    universe_model: liquid_index_etfs_static
    structure_family: iron_condor
    default_structure_model: index_iron_condor_5_10d
    liquidity_profile: short_dated_liquid_options
    entry_routine_profile: short_dated_iron_condor_entry_5m
    portfolio_model: index_condor_1_slot
    protection_model: iron_condor_late_day_protections
    executor_profile: alpaca_auto_direct
    exit_controller: short_dated_iron_condor_exit
  earnings_debit_vertical:
    universe_model: earnings_event_window_dynamic
    allowed_trade_structures:
      - call_debit_spread
      - put_debit_spread
    liquidity_profile: short_dated_liquid_options
    entry_routine_profile: short_dated_entry_5m_morning
    portfolio_model: earnings_call_debit_1_slot
    protection_model: short_dated_default_protections
    executor_profile: alpaca_auto_direct
    exit_controller: short_dated_debit_exit
  earnings_long_vol:
    universe_model: earnings_event_window_dynamic
    allowed_trade_structures:
      - long_straddle
      - long_strangle
    liquidity_profile: short_dated_liquid_options
    entry_routine_profile: short_dated_entry_5m_morning
    portfolio_model: earnings_long_vol_1_slot
    protection_model: short_dated_default_protections
    executor_profile: alpaca_auto_direct
    exit_controller: short_dated_debit_exit
  etf_short_put:
    universe_model: liquid_etf_short_puts_static
    structure_family: short_put
    default_structure_model: etf_short_put_4_10d
    liquidity_profile: short_dated_liquid_options
    entry_routine_profile: short_dated_entry_5m_morning
    portfolio_model: etf_short_put_cash_secured
    protection_model: short_dated_default_protections
    executor_profile: alpaca_auto_direct
    exit_controller: short_dated_credit_exit
