        target: 0.50
      ranking:
        min_probability_of_profit: 0.28
        min_expected_value_dollars: 10
        min_slippage_adjusted_expected_value_dollars: 6
        max_entry_slippage_dollars: 25
        max_model_implied_volatility: 0.60
        weights:
          probability_of_profit: 0.18
          expected_value_dollars: 0.28
          slippage_adjusted_expected_value_dollars: 0.34
          entry_slippage_dollars: 0.12
          model_implied_volatility: 0.08
  earnings_long_strangle_2_10d:
