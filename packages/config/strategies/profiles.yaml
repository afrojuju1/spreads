version: 1
notes:
  - Runtime strategy config is composed from catalog.yaml plus these reusable profiles.
  - Execution posture such as paper, shadow, or live belongs on each catalog strategy.

source_models:
  finviz_momentum_dynamic:
    source:
      type: dynamic
      ref: finviz_momentum
      max_age_seconds: 300
      max_symbols: 10
  earnings_event_window_dynamic:
    source:
      type: dynamic
      ref: earnings_event_window
      max_age_seconds: 21600
      max_symbols: 25
  liquid_index_etfs_static:
    source:
      type: static
      ref: liquid_index_etfs
  liquid_etf_short_puts_static:
    source:
      type: static
      ref: liquid_etf_short_puts

routine_profiles:
  momentum_entry_2m:
    cadence_minutes: 2
    offset_seconds: 30
    market_hours_only: true
    window:
      start_et: "10:00"
      end_et: "15:45"
  momentum_manage_1m:
    cadence_minutes: 1
    offset_seconds: 45
    market_hours_only: true
    window:
      start_et: "10:00"
      end_et: "15:45"
  short_dated_entry_5m_morning:
    cadence_minutes: 5
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "14:30"
  short_dated_entry_5m_full_day:
    cadence_minutes: 5
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "15:45"
  short_dated_iron_condor_entry_5m:
    cadence_minutes: 5
    market_hours_only: true
    window:
      start_et: "09:50"
      end_et: "15:15"
  short_dated_manage_1m:
    cadence_minutes: 1
    offset_seconds: 45
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "15:45"
  short_dated_iron_condor_manage_1m:
    cadence_minutes: 1
    offset_seconds: 45
    market_hours_only: true
    window:
      start_et: "09:50"
      end_et: "15:45"

liquidity_profiles:
  liquid_momentum_options:
    min_open_interest: 200
    max_leg_spread_pct_mid: 0.12
    max_quote_age_seconds: 180
  short_dated_liquid_options:
    min_open_interest: 200
    max_leg_spread_pct_mid: 0.15
    max_quote_age_seconds: 30

structure_models:
  momentum_long_call_7_21d:
    quality_profile: momentum_long_call_v1
    build:
      dte:
        min: 7
        max: 21
      entry_delta:
        min: 0.45
        max: 0.75
        target: 0.55
      ranking:
        max_entry_slippage_dollars: 20
        weights:
          probability_of_profit: 0.12
          expected_value_dollars: 0.20
          slippage_adjusted_expected_value_dollars: 0.24
          entry_slippage_dollars: 0.24
  index_call_credit_4_10d:
    quality_profile: call_credit_spread_v1
    build:
      dte:
        min: 4
        max: 10
      short_delta:
        min: 0.10
        max: 0.28
      widths: [2, 3, 5]
      ranking:
        min_probability_of_profit: 0.60
        min_expected_value_dollars: 10
        min_slippage_adjusted_expected_value_dollars: 8
        max_entry_slippage_dollars: 12
        min_model_implied_volatility: 0.18
        weights:
          probability_of_profit: 0.42
          expected_value_dollars: 0.16
          slippage_adjusted_expected_value_dollars: 0.24
          entry_slippage_dollars: 0.10
          model_implied_volatility: 0.08
  index_put_credit_5_10d:
    quality_profile: put_credit_spread_v1
    build:
      dte:
        min: 5
        max: 10
