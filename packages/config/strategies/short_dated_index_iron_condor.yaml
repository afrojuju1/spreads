strategy_config_id: short_dated_index_iron_condor
strategy:
  family: iron_condor
enabled: true
build:
  dte:
    min: 5
    max: 10
  short_delta:
    min: 0.12
    max: 0.22
  widths: [2, 3, 5]
  symmetric_wings_only: true
  expected_move:
    min_short_vs_expected_move_ratio: -0.30
    min_breakeven_vs_expected_move_ratio: -0.35
recipes:
  entry:
    - neutral_range
  management:
    - take_profit_50pct
    - max_loss_2x_credit
    - expiry_day_exit
liquidity:
  min_open_interest: 200
  max_leg_spread_pct_mid: 0.15
  max_quote_age_seconds: 30
risk:
  min_return_on_risk: 0.13
  max_risk_per_trade: 500
  max_credit_slippage_pct: 0.25
