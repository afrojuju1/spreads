strategy_config_id: short_dated_index_put_credit
strategy:
  family: put_credit_spread
enabled: true
build:
  dte:
    min: 5
    max: 10
  short_delta:
    min: 0.18
    max: 0.28
  widths: [2, 3, 5]
recipes:
  entry:
    - trend_support
  management:
    - take_profit_50pct
    - max_loss_2x_credit
    - expiry_day_exit
liquidity:
  min_open_interest: 200
  max_leg_spread_pct_mid: 0.15
  max_quote_age_seconds: 30
risk:
  min_return_on_risk: 0.13
  max_risk_per_trade: 500
  max_credit_slippage_pct: 0.25
