template_id: growth_transition_software
template_version: v1
status: active

assignment_rules:
  sic_prefixes: []
  naics_prefixes: []
  keyword_rules:
    - software
    - platform
    - cloud
    - saas

required_features:
  - revenue_ttm_growth
  - gross_margin_ttm
  - operating_margin_ttm
  - free_cash_flow_ttm
  - deferred_revenue_growth
  - sbc_as_pct_revenue

optional_features:
  - diluted_share_growth_ttm
  - capex_intensity
  - net_cash_position

quality_weight_map:
  growth_score: 24
  profitability_score: 12
  cash_flow_score: 16
  capital_efficiency_score: 8
  balance_sheet_score: 10
  shareholder_score: 16
  ownership_score: 4
  reporting_quality_score: 10

ownership_weight_map:
  insider_signal: 2
  beneficial_owner_signal: 1
  institutional_holder_signal: 1

valuation_model_mix:
  dcf_weight: 0.65
  historical_multiples_weight: 0.35
  primary_multiple_metrics:
    - ps
    - ev_fcf
    - ev_ebit
  default_multiple_anchors:
    ev_ebit: 18.0
    ev_fcf: 22.0
    ps: 5.2
  forecast_years: 7
  initial_growth_floor: -0.03
  initial_growth_cap: 0.28
  terminal_growth_multiplier: 0.50
  growth_adjustment_factor: 0.95
  growth_adjustment_min: 0.82
  growth_adjustment_max: 1.55
  normalized_fcf_from_ebit_ratio: 0.50
  terminal_growth_floor: 0.018
  terminal_growth_cap: 0.04
  discount_rate_spread_bps: 560
  quality_premium_floor_score: 62
  quality_premium_full_score: 86
  quality_multiple_premium_max: 0.12
  quality_discount_rate_reduction_bps_max: 40

confidence_rules:
  low_confidence_if:
    - persistent_negative_fcf
    - sbc_not_offset_by_growth
    - missing_core_facts
  negative_fcf_penalty: 0.22
  high_leverage_threshold: 2.5
  high_leverage_penalty: 0.12
  declining_revenue_penalty: 0.08
  unprofitable_penalty: 0.12

risk_rules:
  add_flags_if:
    - sbc_dilution_heavy
    - ownership_concentration_high
    - margin_reversal
    - multiple_compression_risk

unsupported_conditions: []
