bot_id: short_dated_index_credit_bot
name: Short-Dated Index Credit Bot
limits:
  capital_limit: 5000
  max_open_positions: 30
  max_daily_actions: 30
  max_new_entries_per_day: 30
  daily_loss_limit: 250
runtime:
  live_enabled: false
  cancel_pending_entries_after_et: "15:30"
  flatten_positions_at_et: "15:45"
  paused: false
automations:
  - index_put_credit_entry
  - index_put_credit_manage
