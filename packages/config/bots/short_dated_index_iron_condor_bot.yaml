bot_id: short_dated_index_iron_condor_bot
name: Short-Dated Index Iron Condor Bot
limits:
  capital_limit: 5000
  max_open_positions: 30
  max_daily_actions: 30
  max_new_entries_per_day: 30
  daily_loss_limit: 250
runtime:
  live_enabled: false
  cancel_pending_entries_after_et: "15:00"
  flatten_positions_at_et: "15:40"
  paused: false
automations:
  - index_iron_condor_entry
  - index_iron_condor_manage
