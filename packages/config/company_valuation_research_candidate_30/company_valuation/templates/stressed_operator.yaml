template_id: stressed_operator
template_version: v1
status: active

assignment_rules:
  sic_prefixes: []
  naics_prefixes: []
  keyword_rules:
    - distressed
    - leveraged
    - turnaround

required_features:
  - revenue_ttm_growth
  - operating_margin_ttm
  - free_cash_flow_ttm
  - capex_intensity
  - net_leverage

optional_features:
  - reserve_proxy_trend
  - diluted_share_growth_ttm
  - hedge_exposure_proxy

quality_weight_map:
  growth_score: 8
  profitability_score: 10
  cash_flow_score: 20
  capital_efficiency_score: 12
  balance_sheet_score: 22
  shareholder_score: 8
  ownership_score: 6
  reporting_quality_score: 14

ownership_weight_map:
  insider_signal: 3
  beneficial_owner_signal: 2
  institutional_holder_signal: 1

valuation_model_mix:
  dcf_weight: 0.35
  historical_multiples_weight: 0.65
  primary_multiple_metrics:
    - pb
    - ev_fcf
    - ev_ebitda
  default_multiple_anchors:
    ev_fcf: 8.0
    pb: 0.95
    ev_ebitda: 5.5
    ev_ebit: 5.0
  forecast_years: 5
  initial_growth_floor: -0.15
  initial_growth_cap: 0.10
  terminal_growth_multiplier: 0.25
  growth_adjustment_factor: 0.35
  growth_adjustment_min: 0.62
  growth_adjustment_max: 1.05
  normalized_fcf_from_ebit_ratio: 0.72
  terminal_growth_floor: 0.0
  terminal_growth_cap: 0.015
  discount_rate_spread_bps: 650
  cyclical_discount_rate_spread_bps: 150
  quality_premium_floor_score: 50
  quality_premium_full_score: 72
  quality_multiple_premium_max: 0.04
  quality_discount_rate_reduction_bps_max: 10

confidence_rules:
  low_confidence_if:
    - high_cycle_exposure
    - persistent_negative_fcf
    - missing_core_facts
  negative_fcf_penalty: 0.26
  high_leverage_threshold: 3.2
  high_leverage_penalty: 0.14
  declining_revenue_penalty: 0.12
  unprofitable_penalty: 0.12
  cyclical_penalty: 0.12

risk_rules:
  add_flags_if:
    - commodity_cycle_risk
    - leverage_above_threshold
    - ownership_concentration_high

unsupported_conditions: []
