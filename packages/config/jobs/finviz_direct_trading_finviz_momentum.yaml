job_key: finviz_direct_trading:finviz_momentum
job_type: finviz_direct_trading
enabled: true
schedule:
  type: interval_minutes
  minutes: 2
payload:
  label: finviz_direct_momentum
  bot_id: finviz
  automation_id: finviz_direct
  strategy_id: finviz_direct
  feed_id: finviz_momentum
  feed_job_key: symbol_feed:finviz_momentum
  max_feed_age_seconds: 300
  max_candidates: 10
  stock_feed: iex
  instrument_mode: long_call
  equity_fallback: false
  quantity: 1
  max_notional: 500
  execution_runtime: alpaca_direct
  option_execution_runtime: alpaca_direct
  approval_mode: auto
  execution_mode: paper
  dispatch_after_trigger: true
  allow_short_selling: false
  allow_off_hours: false
  max_new_positions_per_run: 10
  max_open_positions: 10
  max_daily_entries: 15
  max_daily_loss: 500
  entry_rules:
    enabled: true
    side: buy
    min_price: 10
    min_market_cap: 1000000000
    min_daily_volume: 1000000
    min_move_percent: 0
    require_positive_momentum: true
    max_spread_pct: 1.0
    max_quote_age_seconds: 180
    limit_price_offset_bps: 0
    timing:
      mode: vwap_reclaim
      not_before_time: "10:00"
      min_intraday_bars: 30
      recent_lookback_bars: 5
      confirmation_bars: 2
      breakout_tolerance_bps: 5
  option_entry_rules:
    min_dte: 7
    max_dte: 21
    option_feed: opra
    quote_feeds:
      - opra
      - indicative
    min_open_interest: 500
    min_daily_volume: 100
    min_delta: 0.45
    preferred_min_delta: 0.50
    preferred_max_delta: 0.65
    max_delta: 0.75
    target_delta: 0.55
    max_spread_pct: 10
    max_quote_age_seconds: 180
    max_premium: 500
    limit_price_offset_bps: 0
  exit_rules:
    enabled: true
    profit_target_pct: 0.03
    stop_loss_pct: 0.015
    sell_when_removed_from_feed: false
    max_spread_pct: 1.0
    max_quote_age_seconds: 180
    limit_price_offset_bps: 0
  option_exit_rules:
    enabled: true
    profit_target_pct: 0.40
    stop_loss_pct: 0.30
    sell_when_removed_from_feed: false
    force_close_minutes_before_close: 15
    max_spread_pct: 20
    max_quote_age_seconds: 180
    limit_price_offset_bps: 0
    repricing:
      enabled: true
      stale_after_seconds: 75
      max_reprices: 3
      price_step: 0.01
      max_concession: 0.03
    underlying_invalidation:
      enabled: true
      min_intraday_bars: 30
      recent_lookback_bars: 5
      confirmation_bars: 2
      breakdown_tolerance_bps: 5
      max_spread_pct: 1.0
      max_quote_age_seconds: 180
singleton_scope: finviz_momentum
