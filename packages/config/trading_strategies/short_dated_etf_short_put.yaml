trading_strategy_id: short_dated_etf_short_put
name: Short-Dated ETF Short Put
enabled: false
source:
  type: static
  ref: liquid_etf_short_puts
trade_structure: short_put
build:
  dte:
    min: 4
    max: 10
  entry_delta:
    min: 0.08
    max: 0.16
    target: 0.12
  min_fill_ratio: 0.72
  expected_move:
    min_short_vs_expected_move_ratio: -0.05
    min_breakeven_vs_expected_move_ratio: -0.02
  ranking:
    min_probability_of_profit: 0.78
    min_expected_value_dollars: 0
    min_slippage_adjusted_expected_value_dollars: 0
    max_entry_slippage_dollars: 10
    min_model_implied_volatility: 0.18
    weights:
      probability_of_profit: 0.38
      expected_value_dollars: 0.18
      slippage_adjusted_expected_value_dollars: 0.26
      entry_slippage_dollars: 0.10
      model_implied_volatility: 0.08
entry:
  schedule:
    cadence_minutes: 5
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "14:30"
  selection:
    min_signal_score: 60
management:
  schedule:
    cadence_minutes: 1
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "15:45"
  recipes:
    - take_profit_50pct
    - max_loss_2x_credit
    - expiry_day_exit
liquidity:
  min_open_interest: 200
  max_leg_spread_pct_mid: 0.15
  max_quote_age_seconds: 30
risk:
  limits:
    extends: baseline
  sizing:
    min_return_on_risk: 0.05
    position_size_pct_of_available_balance: 0.0025
    max_credit_slippage_pct: 0.25
runtime:
  extends: short_dated_default
execution:
  approval: auto
  mode: paper
  runtime: alpaca_direct
