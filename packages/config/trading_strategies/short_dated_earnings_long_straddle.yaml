trading_strategy_id: short_dated_earnings_long_straddle
name: Short-Dated Earnings Long Straddle
enabled: true
source:
  type: static_universe
  ref: liquid_stocks
trade_structure: long_straddle
build:
  dte:
    min: 2
    max: 10
  entry_delta:
    min: 0.45
    max: 0.55
    target: 0.50
  ranking:
    min_probability_of_profit: 0.28
    min_expected_value_dollars: 10
    min_slippage_adjusted_expected_value_dollars: 6
    max_entry_slippage_dollars: 25
    max_model_implied_volatility: 0.60
    weights:
      probability_of_profit: 0.18
      expected_value_dollars: 0.28
      slippage_adjusted_expected_value_dollars: 0.34
      entry_slippage_dollars: 0.12
      model_implied_volatility: 0.08
entry:
  schedule:
    cadence_minutes: 5
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "14:30"
  selection:
    min_opportunity_score: 60
management:
  schedule:
    cadence_minutes: 1
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "15:45"
  recipes:
    - take_profit_50pct
    - max_loss_2x_credit
    - expiry_day_exit
liquidity:
  min_open_interest: 200
  max_leg_spread_pct_mid: 0.15
  max_quote_age_seconds: 30
risk:
  limits:
    extends: baseline
  sizing:
    min_return_on_risk: 0.05
    position_size_pct_of_available_balance: 0.0025
    max_credit_slippage_pct: 0.25
runtime:
  extends: short_dated_default
execution:
  approval: auto
  mode: shadow
  runtime: alpaca_direct
