trading_strategy_id: short_dated_earnings_put_debit
name: Short-Dated Earnings Put Debit
enabled: true
source:
  type: static
  ref: liquid_stocks
trade_structure: put_debit_spread
build:
  dte:
    min: 4
    max: 10
  short_delta:
    min: 0.20
    max: 0.35
    target: 0.27
  widths: [2, 3, 5]
  ranking:
    min_probability_of_profit: 0.25
    min_expected_value_dollars: 10
    min_slippage_adjusted_expected_value_dollars: 6
    max_entry_slippage_dollars: 12
    max_model_implied_volatility: 0.60
    weights:
      probability_of_profit: 0.28
      expected_value_dollars: 0.26
      slippage_adjusted_expected_value_dollars: 0.28
      entry_slippage_dollars: 0.10
      model_implied_volatility: 0.08
entry:
  schedule:
    cadence_minutes: 5
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "14:30"
  selection:
    min_opportunity_score: 72
management:
  schedule:
    cadence_minutes: 1
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "15:45"
  recipes:
    - take_profit_40pct
    - max_loss_40pct_debit
    - expiry_day_exit
liquidity:
  min_open_interest: 200
  max_leg_spread_pct_mid: 0.15
  max_quote_age_seconds: 30
risk:
  limits:
    extends: baseline
  sizing:
    min_return_on_risk: 0.05
    position_size_pct_of_available_balance: 0.0025
    max_credit_slippage_pct: 0.25
runtime:
  extends: short_dated_default
execution:
  approval: auto
  mode: paper
  runtime: alpaca_direct
