trading_strategy_id: short_dated_index_call_credit
name: Short-Dated Index Call Credit
enabled: true
source:
  type: static_universe
  ref: liquid_index_etfs
trade_structure: call_credit_spread
build:
  dte:
    min: 4
    max: 10
  short_delta:
    min: 0.10
    max: 0.28
  widths: [2, 3, 5]
  ranking:
    min_probability_of_profit: 0.60
    min_expected_value_dollars: 10
    min_slippage_adjusted_expected_value_dollars: 8
    max_entry_slippage_dollars: 12
    min_model_implied_volatility: 0.18
    weights:
      probability_of_profit: 0.42
      expected_value_dollars: 0.16
      slippage_adjusted_expected_value_dollars: 0.24
      entry_slippage_dollars: 0.10
      model_implied_volatility: 0.08
entry:
  schedule:
    cadence_minutes: 5
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "15:45"
  selection:
    min_opportunity_score: 60
  recipes:
    - trend_resistance
management:
  schedule:
    cadence_minutes: 1
    market_hours_only: true
    window:
      start_et: "09:45"
      end_et: "15:45"
  recipes:
    - take_profit_50pct
    - max_loss_2x_credit
    - expiry_day_exit
liquidity:
  min_open_interest: 200
  max_leg_spread_pct_mid: 0.15
  max_quote_age_seconds: 30
risk:
  limits:
    extends: baseline
  sizing:
    min_return_on_risk: 0.13
    position_size_pct_of_available_balance: 0.0025
    max_credit_slippage_pct: 0.25
runtime:
  extends: short_dated_default
execution:
  approval: auto
  mode: paper
  runtime: alpaca_direct
